<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Scheduler with Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📚 Class Scheduler</h1>
    <p id="currentTime">Current Time: --:--:--</p>

    <table id="scheduleTable">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Start Time</th>
          <th>End Time</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Compiler Construction</td>
          <td>09:00</td>
          <td>10:00</td>
        </tr>
        <tr>
          <td>Computer Networks</td>
          <td>10:15</td>
          <td>11:15</td>
        </tr>
        <tr>
          <td>Data Compression</td>
          <td>11:30</td>
          <td>12:30</td>
        </tr>
        <tr>
          <td>Web Development</td>
          <td>13:30</td>
          <td>14:30</td>
        </tr>
      </tbody>
    </table>

    <div id="countdown">
      ⏳ Next Class Starts In: <span id="timer">--:--:--</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
