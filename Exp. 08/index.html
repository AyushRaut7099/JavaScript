<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Admission Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>🏋️‍♂️ Gym Admission Form</h2>
    <form id="gymForm" onsubmit="return validateForm()">
      
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" onblur="validateName()" />
      <span class="error" id="nameError"></span>

      <label for="email">Email:</label>
      <input type="text" id="email" name="email" placeholder="Enter your email" onblur="validateEmail()" />
      <span class="error" id="emailError"></span>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" placeholder="Enter your age" onchange="validateAge()" />
      <span class="error" id="ageError"></span>

      <label for="gender">Gender:</label>
      <select id="gender" name="gender" onchange="validateGender()">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
      <span class="error" id="genderError"></span>

      <label for="contact">Contact Number:</label>
      <input type="text" id="contact" name="contact" placeholder="Enter 10-digit mobile number" onblur="validateContact()" />
      <span class="error" id="contactError"></span>

      <label for="address">Address:</label>
      <textarea id="address" name="address" rows="3" placeholder="Enter your address" onblur="validateAddress()"></textarea>
      <span class="error" id="addressError"></span>

      <label for="membership">Membership Type:</label>
      <select id="membership" name="membership">
        <option value="">Select Plan</option>
        <option value="Basic">Basic - ₹999/month</option>
        <option value="Premium">Premium - ₹1499/month</option>
        <option value="Elite">Elite - ₹1999/month</option>
      </select>
      <span class="error" id="membershipError"></span>

      <label for="startDate">Start Date:</label>
      <input type="date" id="startDate" name="startDate" onchange="validateDate()" />
      <span class="error" id="dateError"></span>

      <label>Preferred Workout Time:</label>
      <div class="radio-group">
        <label><input type="radio" name="time" value="Morning" /> Morning</label>
        <label><input type="radio" name="time" value="Evening" /> Evening</label>
        <label><input type="radio" name="time" value="Night" /> Night</label>
      </div>
      <span class="error" id="timeError"></span>

      <div class="terms">
        <input type="checkbox" id="terms" /> I agree to the gym’s terms & conditions.
      </div>
      <span class="error" id="termsError"></span>

      <button type="submit">Submit Form</button>
    </form>
    <div id="successMessage"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
